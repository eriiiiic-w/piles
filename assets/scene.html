<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 桩基视图</title>
<style>
  body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
  #info { position: absolute; top: 20px; left: 20px; color: #333; background: rgba(255,255,255,0.9); padding: 10px 16px; border-radius: 6px; pointer-events: none; font-size: 14px; }
  #tooltip { position: absolute; display: none; background: rgba(0,0,0,0.85); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; max-width: 260px; line-height: 1.5; }
  #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  button { margin: 4px; padding: 8px 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { background: #eee; }
</style>
</head>
<body>
<div id="info">加载中...</div>
<div id="tooltip"></div>
<div id="controls">
  <button id="btn-front">正视</button>
  <button id="btn-top">俯视</button>
  <button id="btn-side">侧视</button>
  <button id="btn-reset">重置</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// DATA_PLACEHOLDER

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.panSpeed = 1.0;
controls.screenSpacePanning = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
const info = document.getElementById('info');
let pileMeshes = [];
let sceneData = null;

function createPiles(data) {
  const group = new THREE.Group();
  pileMeshes = [];

  const colorMap = {
    '灌注桩': 0x3498db,
    '预制桩': 0xe67e22,
    '未知': 0x95a5a6
  };

  data.piles.forEach(pile => {
    const pileHeight = (pile.bottom_elev != null)
      ? Math.abs(pile.top_elev - pile.bottom_elev)
      : Math.abs(pile.top_elev - data.bounds.z[0]);

    if (pileHeight < 0.1) return;

    const r = Math.min(pile.diameter / 2000, 0.25);
    const geometry = new THREE.CylinderGeometry(r, r, pileHeight, 8);
    const color = colorMap[pile.pile_type] || 0x95a5a6;
    const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.2 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = Math.PI / 2;

    const midZ = (pile.top_elev + (pile.bottom_elev || data.bounds.z[0])) / 2;
    mesh.position.set(pile.x, pile.y, midZ);
    mesh.userData = {
      type: 'pile', pileId: pile.id, diameter: pile.diameter,
      pileType: pile.pile_type, topElev: pile.top_elev,
      bottomElev: pile.bottom_elev, x: pile.x, y: pile.y
    };
    group.add(mesh);
    pileMeshes.push(mesh);

    // Label
    const div = document.createElement('div');
    div.textContent = pile.id;
    div.style.cssText = 'font-size:9px;color:#333;background:rgba(255,255,255,0.85);padding:1px 4px;border-radius:2px;';
    const label = new CSS2DObject(div);
    label.position.set(pile.x, pile.y, pile.top_elev + 1);
    group.add(label);
  });

  return group;
}

function createGround(bounds) {
  const w = bounds.x[1] - bounds.x[0];
  const d = bounds.y[1] - bounds.y[0];
  if (w <= 0 || d <= 0) return new THREE.Group();
  const cx = (bounds.x[0] + bounds.x[1]) / 2;
  const cy = (bounds.y[0] + bounds.y[1]) / 2;
  const geom = new THREE.PlaneGeometry(w * 1.2, d * 1.2);
  const mat = new THREE.MeshBasicMaterial({ color: 0xdddddd, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
  const ground = new THREE.Mesh(geom, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(cx, cy, bounds.z[0] - 0.5);
  return ground;
}

function initScene(data) {
  sceneData = data;
  while (scene.children.length > 0) scene.remove(scene.children[0]);

  const bx = data.bounds.x, by = data.bounds.y, bz = data.bounds.z;
  const axisSize = Math.max(bx[1] - bx[0], by[1] - by[0]) * 0.4;
  const axes = new THREE.AxesHelper(axisSize);
  scene.add(axes);

  // Axis labels
  function makeAxisLabel(text, x, y, z, color) {
    const div = document.createElement('div');
    div.textContent = text;
    div.style.cssText = `font-size:14px;font-weight:bold;color:${color};background:rgba(255,255,255,0.8);padding:1px 5px;border-radius:3px;`;
    const label = new CSS2DObject(div);
    label.position.set(x, y, z);
    return label;
  }
  scene.add(makeAxisLabel('X', axisSize, 0, 0, '#e74c3c'));
  scene.add(makeAxisLabel('Y', 0, axisSize, 0, '#2ecc71'));
  scene.add(makeAxisLabel('Z', 0, 0, axisSize, '#3498db'));

  scene.add(createGround(data.bounds));
  scene.add(createPiles(data));

  const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
  light1.position.set(100, 80, 100);
  scene.add(light1);
  const light2 = new THREE.AmbientLight(0x707070, 0.5);
  scene.add(light2);

  const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2, cz = (bz[0] + bz[1]) / 2;
  const extent = Math.max(bx[1] - bx[0], by[1] - by[0], bz[1] - bz[0]) * 0.25;
  camera.position.set(cx + extent, cy + extent * 0.4, cz + extent);
  controls.target.set(cx, cy, cz);
  controls.update();

  info.textContent = `桩基: ${data.piles.length} 根 | 持力层: ${data.support_layer || '未指定'} | 拖拽旋转/滚轮缩放`;
}

function setView(dir) {
  if (!sceneData) return;
  const bx = sceneData.bounds.x, by = sceneData.bounds.y, bz = sceneData.bounds.z;
  const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2, cz = (bz[0] + bz[1]) / 2;
  const dist = Math.max(bx[1] - bx[0], by[1] - by[0], bz[1] - bz[0]) * 1.2;
  if (dir === 'front') camera.position.set(cx, cy, cz + dist);
  else if (dir === 'top') camera.position.set(cx, cy + dist, cz + 0.1);
  else if (dir === 'side') camera.position.set(cx + dist, cy, cz);
  controls.target.set(cx, cy, cz);
  controls.update();
}

function resetView() {
  if (sceneData) {
    const bx = sceneData.bounds.x, by = sceneData.bounds.y, bz = sceneData.bounds.z;
    const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2, cz = (bz[0] + bz[1]) / 2;
    const extent = Math.max(bx[1] - bx[0], by[1] - by[0]) * 0.25;
    camera.position.set(cx + extent, cy + extent * 0.4, cz + extent);
    controls.target.set(cx, cy, cz);
    controls.update();
  }
}

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(pileMeshes);
  if (intersects.length > 0) {
    const d = intersects[0].object.userData;
    tooltip.innerHTML = `<b>${d.pileId}</b><br>桩径: ${d.diameter}mm | 桩型: ${d.pileType}<br>桩顶: ${d.topElev.toFixed(2)}m<br>桩底: ${d.bottomElev != null ? d.bottomElev.toFixed(2) : '?'}m`;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

function loadData() {
  if (typeof EMBEDDED_DATA !== 'undefined') {
    try {
      initScene(EMBEDDED_DATA);
    } catch(e) {
      info.textContent = '场景初始化失败: ' + e.message;
      console.error(e);
    }
  } else {
    info.textContent = '数据未加载，请通过程序启动3D视图';
  }
}

document.getElementById('btn-front').addEventListener('click', () => setView('front'));
document.getElementById('btn-top').addEventListener('click', () => setView('top'));
document.getElementById('btn-side').addEventListener('click', () => setView('side'));
document.getElementById('btn-reset').addEventListener('click', () => resetView());

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setTimeout(loadData, 300);
animate();
</script>
</body>
</html>
