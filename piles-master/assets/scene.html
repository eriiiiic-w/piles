<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 桩基视图</title>
<style>
  body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
  #info { position: absolute; top: 60px; left: 20px; color: #333; background: rgba(255,255,255,0.85); padding: 8px 14px; border-radius: 6px; pointer-events: none; font-size: 13px; }
  #tooltip { position: absolute; display: none; background: rgba(0,0,0,0.85); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; max-width: 260px; line-height: 1.5; z-index: 10; }
  #controls { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
  button { padding: 6px 14px; border: 1px solid #bbb; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; font-family: 'Microsoft YaHei', sans-serif; }
  button:hover { background: #e8e8e8; }
  #sidebar { position: absolute; left: 15px; top: 60px; width: 220px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 14px; display: none; box-shadow: 0 2px 12px rgba(0,0,0,0.12); font-size: 13px; line-height: 1.6; }
  #sidebar h3 { margin: 0 0 8px 0; font-size: 15px; color: #2c3e50; }
  #sidebar p { margin: 3px 0; color: #555; }
  #sidebar .hint { color: #999; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="info">加载中...</div>
<div id="tooltip"></div>
<div id="sidebar"><h3 id="s_title">桩号</h3><div id="s_content"></div><p class="hint">点击空白处关闭</p></div>
<div id="controls">
  <button id="btn-front">正视</button>
  <button id="btn-top">俯视</button>
  <button id="btn-side">侧视</button>
  <button id="btn-reset">重置</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// DATA_PLACEHOLDER

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);
camera.up.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.panSpeed = 1.0;
controls.screenSpacePanning = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
const info = document.getElementById('info');
let pileMeshes = [];
let sceneData = null;

function createPiles(data) {
  const group = new THREE.Group();
  pileMeshes = [];
  const colorMap = { '灌注桩': 0x3498db, '预制桩': 0xe67e22, '未知': 0x95a5a6 };

  data.piles.forEach(pile => {
    const pileHeight = (pile.bottom_elev != null)
      ? Math.abs(pile.top_elev - pile.bottom_elev)
      : Math.abs(pile.top_elev - data.bounds.z[0]);
    if (pileHeight < 0.1) return;

    const r = Math.max(pile.diameter / 2000, 0.3);
    const geometry = new THREE.CylinderGeometry(r, r, pileHeight, 8);
    const color = colorMap[pile.pile_type] || 0x95a5a6;
    const material = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2 });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = Math.PI / 2;
    const midZ = (pile.top_elev + (pile.bottom_elev || data.bounds.z[0])) / 2;
    mesh.position.set(pile.x, pile.y, midZ);
    mesh.userData = { type: 'pile', pileId: pile.id, diameter: pile.diameter, pileType: pile.pile_type, topElev: pile.top_elev, bottomElev: pile.bottom_elev, x: pile.x, y: pile.y };
    group.add(mesh);
    pileMeshes.push(mesh);
  });
  return group;
}

function createGround(bounds) {
  const w = bounds.x[1] - bounds.x[0], d = bounds.y[1] - bounds.y[0];
  if (w <= 0 || d <= 0) return new THREE.Group();
  const cx = (bounds.x[0] + bounds.x[1]) / 2, cy = (bounds.y[0] + bounds.y[1]) / 2;
  const geom = new THREE.PlaneGeometry(w * 1.2, d * 1.2);
  const mat = new THREE.MeshBasicMaterial({ color: 0xdddddd, side: THREE.DoubleSide, transparent: true, opacity: 0.25 });
  const ground = new THREE.Mesh(geom, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(cx, cy, bounds.z[0] - 0.5);
  return ground;
}

function initScene(data) {
  sceneData = data;
  while (scene.children.length > 0) scene.remove(scene.children[0]);

  scene.add(createGround(data.bounds));
  scene.add(createPiles(data));

  const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
  light1.position.set(100, 80, 100);
  scene.add(light1);
  const light2 = new THREE.AmbientLight(0x707070, 0.5);
  scene.add(light2);

  const bx = data.bounds.x, by = data.bounds.y, bz = data.bounds.z;
  const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2, cz = (bz[0] + bz[1]) / 2;
  const extent = Math.max(bx[1] - bx[0], by[1] - by[0], bz[1] - bz[0]) * 0.25;
  camera.position.set(cx + extent, cy + extent * 0.4, cz + extent);
  controls.target.set(cx, cy, cz);
  controls.update();

  info.textContent = `桩基: ${data.piles.length} 根 | 持力层: ${data.support_layer || '未指定'} | 左键旋转 / 右键平移 / 滚轮缩放`;
}

function setView(dir) {
  if (!sceneData) return;
  const bx = sceneData.bounds.x, by = sceneData.bounds.y, bz = sceneData.bounds.z;
  const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2, cz = (bz[0] + bz[1]) / 2;
  const dist = Math.max(bx[1] - bx[0], by[1] - by[0], bz[1] - bz[0]) * 1.2;
  if (dir === 'front') camera.position.set(cx + dist, cy, cz);
  else if (dir === 'top') camera.position.set(cx, cy, cz + dist);
  else if (dir === 'side') camera.position.set(cx, cy + dist, cz);
  controls.target.set(cx, cy, cz);
  controls.update();
}

function resetView() {
  if (!sceneData) return;
  const bx = sceneData.bounds.x, by = sceneData.bounds.y, bz = sceneData.bounds.z;
  const cx = (bx[0] + bx[1]) / 2, cy = (by[0] + by[1]) / 2, cz = (bz[0] + bz[1]) / 2;
  const extent = Math.max(bx[1] - bx[0], by[1] - by[0]) * 0.25;
  camera.position.set(cx + extent, cy + extent * 0.4, cz + extent);
  controls.target.set(cx, cy, cz);
  controls.update();
}

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(pileMeshes);
  if (intersects.length > 0) {
    const d = intersects[0].object.userData;
    tooltip.textContent = d.pileId;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 15) + 'px';
    tooltip.style.top = (e.clientY + 15) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});

const sidebar = document.getElementById('sidebar');
const sTitle = document.getElementById('s_title');
const sContent = document.getElementById('s_content');

window.addEventListener('click', (e) => {
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(pileMeshes);
  if (intersects.length > 0) {
    const d = intersects[0].object.userData;
    sTitle.textContent = d.pileId;
    sContent.innerHTML = `桩径: ${d.diameter}mm<br>桩型: ${d.pileType}<br>桩顶标高: ${d.topElev.toFixed(2)}m<br>桩底标高: ${d.bottomElev != null ? d.bottomElev.toFixed(2) + 'm' : '未计算'}<br>坐标: X=${d.x.toFixed(1)} Y=${d.y.toFixed(1)}`;
    sidebar.style.display = 'block';
  } else {
    sidebar.style.display = 'none';
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function loadData() {
  if (typeof EMBEDDED_DATA !== 'undefined') {
    try { initScene(EMBEDDED_DATA); }
    catch(e) { info.textContent = '场景初始化失败: ' + e.message; console.error(e); }
  } else {
    info.textContent = '数据未加载，请通过程序启动3D视图';
  }
}

document.getElementById('btn-front').addEventListener('click', () => setView('front'));
document.getElementById('btn-top').addEventListener('click', () => setView('top'));
document.getElementById('btn-side').addEventListener('click', () => setView('side'));
document.getElementById('btn-reset').addEventListener('click', () => resetView());

// Corner gizmo — top-right
const gizmoScene = new THREE.Scene();
const gizmoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
gizmoCamera.position.set(1.5, 1.2, 2);
gizmoCamera.lookAt(0, 0, 0);
gizmoScene.add(new THREE.AxesHelper(1));

function renderGizmo() {
  const w = window.innerWidth, h = window.innerHeight;
  const size = 80;
  renderer.setViewport(w - size - 15, 15, size, size);
  renderer.setScissor(w - size - 15, 15, size, size);
  renderer.setScissorTest(true);
  renderer.render(gizmoScene, gizmoCamera);
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, w, h);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  const dir = camera.position.clone().sub(controls.target).normalize();
  gizmoCamera.position.copy(dir.multiplyScalar(3));
  gizmoCamera.lookAt(0, 0, 0);
  renderGizmo();
}

setTimeout(loadData, 300);
animate();
</script>
</body>
</html>
